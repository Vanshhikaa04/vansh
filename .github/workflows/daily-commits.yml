name: Daily Python Commits

on:
  schedule:
    # 17 slots/day, hourly 06:00-22:00 UTC. Must match SLOTS_PER_DAY in
    # bot/commit_bot.py. Adjust the window/step to fit your timezone.
    - cron: "0 6-22 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: daily-commits
  cancel-in-progress: false

jobs:
  commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Configure git identity
        env:
          BOT_GIT_NAME: ${{ vars.BOT_GIT_NAME }}
          BOT_GIT_EMAIL: ${{ vars.BOT_GIT_EMAIL }}
        run: |
          git config user.name "${BOT_GIT_NAME:-$GITHUB_REPOSITORY_OWNER}"
          if [ -z "$BOT_GIT_EMAIL" ]; then
            echo "::error::Set the BOT_GIT_EMAIL repository variable to your GitHub-verified email (or your users.noreply.github.com address) so commits are credited to your account. See README.md."
            exit 1
          fi
          git config user.email "$BOT_GIT_EMAIL"

      - name: Run commit bot
        run: python bot/commit_bot.py
